[project]
name = "kb-core"
version = "0.2.0"
description = "OKF-style markdown knowledge base: entries, store, FTS5 search"
requires-python = ">=3.11"
dependencies = ["pyyaml>=6.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kb_core"]
