services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: finalboss
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    env_file: .env
    environment:
      # Override host so it resolves inside Docker network, not localhost
      DATABASE_URL: postgresql://postgres:postgres@db:5432/finalboss
    depends_on:
      db:
        condition: service_healthy

volumes:
  db_data:
